<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Forense - v6.0</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #111; --accent: #007bff; --text: #eee; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; padding: 20px; }
        .container { background: var(--card); border: 1px solid #222; border-radius: 12px; width: 100%; max-width: 650px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .hidden { display: none; }
        h1 { text-align: center; color: var(--accent); font-size: 1.2rem; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .section { background: #181818; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 3px solid var(--accent); }
        .section-title { font-size: 0.75rem; font-weight: bold; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; display: block; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .row div { flex: 1; }
        label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 0.85rem; }
        .upload-btn { border: 2px dashed #444; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .upload-btn:hover { border-color: var(--accent); background: #1a1a1a; }
        .status-msg { font-size: 10px; font-family: monospace; margin-top: 5px; color: #f1c40f; }
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-success { background: #28a745; color: white; }
        .btn-menu { background: #1a1a1a; border: 1px solid var(--accent); color: #fff; padding: 30px; font-size: 1rem; }
    </style>
</head>
<body>

    <div id="scr-home" class="container">
        <h1>Painel de Controle Forense</h1>
        <div style="display: grid; gap: 15px; margin-top: 20px;">
            <button class="btn-main btn-menu" onclick="nav('scr-pericia')">📝 NOVO LAUDO PERICIAL</button>
            <button class="btn-main btn-menu" style="border-color: #e67e22;" onclick="alert('Módulo em breve')">⚖️ REGISTRO DE PRISÃO</button>
        </div>
    </div>

    <div id="scr-pericia" class="container hidden">
        <h1>Laudo de Perícia Criminal</h1>
        
        <div class="section">
            <span class="section-title">Informações de Campo</span>
            <div class="row">
                <div><label>Discord Perito</label><input type="text" id="p-perito" value="67615"></div>
                <div><label>Discord Auxiliar</label><input type="text" id="p-auxiliar" value="na"></div>
            </div>
            <div class="form-group"><label>Local da Ocorrência</label><input type="text" id="p-ref" placeholder="Ex: Estacionamento Vermelho"></div>
        </div>

        <div class="section">
            <span class="section-title">IA: Leitura de MDT (Painel Policial)</span>
            <div class="upload-btn" onclick="document.getElementById('in-mdt').click()">Anexar Print do MDT</div>
            <input type="file" id="in-mdt" class="hidden" accept="image/*">
            <div id="st-mdt" class="status-msg">Aguardando...</div>
            <div class="row">
                <div><label>Nome</label><input type="text" id="p-nome"></div>
                <div><label>ID / Passaporte</label><input type="text" id="p-doc"></div>
            </div>
            <div class="row">
                <div><label>Idade</label><input type="text" id="p-idade"></div>
                <div><label>Porte</label><input type="text" id="p-porte"></div>
            </div>
        </div>

        <div class="section">
            <span class="section-title">IA: Leitura de Mochila</span>
            <div class="upload-btn" onclick="document.getElementById('in-inv').click()">Anexar Print do Inventário</div>
            <input type="file" id="in-inv" class="hidden" accept="image/*">
            <div id="st-inv" class="status-msg">Aguardando...</div>
            <textarea id="p-itens" rows="3" placeholder="Itens ilícitos..."></textarea>
        </div>

        <button class="btn-main btn-success" onclick="gerar()">Copiar Relatório Final</button>
        <button class="btn-main" style="background:#333; color:#ccc;" onclick="nav('scr-home')">Voltar</button>
    </div>

    <textarea id="copy-helper" style="position: absolute; left: -9999px;"></textarea>

    <script>
        function nav(id) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Itens específicos do seu inventário (Fluxo/Roleplay)
        const dbItens = [
            {key: "parafall", name: "1x PARAFALL (7.62)"},
            {key: "radio", name: "1x Rádio de Comunicação"},
            {key: "cristal", name: "Cristal (Entorpecente)"},
            {key: "muni", name: "Munições Variadas"},
            {key: "pistola", name: "1x Pistola (9mm)"}
        ];

        async function lerImagem(file, statusId, callback) {
            const st = document.getElementById(statusId);
            st.innerText = "⏳ IA PROCESSANDO (BRILHO AUTO)...";
            
            try {
                // Tesseract com engine otimizada
                const result = await Tesseract.recognize(file, 'por', {
                    logger: m => console.log(m.status)
                });
                st.innerText = "✅ SUCESSO!";
                callback(result.data.text.toLowerCase(), result.data.text);
            } catch (e) {
                st.innerText = "❌ ERRO DE LEITURA (VERIFIQUE A PRINT)";
            }
        }

        document.getElementById('in-mdt').addEventListener('change', e => {
            lerImagem(e.target.files[0], 'st-mdt', (low, raw) => {
                // O seu MDT tem os títulos (Nome, Identidade, etc)
                // A IA vai buscar o que vem depois dessas palavras
                const lines = raw.split('\n');
                lines.forEach((line, i) => {
                    if(line.toLowerCase().includes("identidade")) {
                        let id = lines[i+1] || "";
                        document.getElementById('p-doc').value = id.replace(/\D/g, "");
                    }
                    if(line.toLowerCase().includes("idade")) {
                        document.getElementById('p-idade').value = (lines[i+1] || "").trim();
                    }
                });
                
                if(low.includes("desabilitado")) document.getElementById('p-porte').value = "Desabilitado";
                else if(low.includes("habilitado")) document.getElementById('p-porte').value = "Habilitado";

                // Pega a primeira linha que parece um nome (Letras maiúsculas)
                const nome = raw.match(/[A-Z][a-z]+ [A-Z][a-z]+/);
                if(nome) document.getElementById('p-nome').value = nome[0];
            });
        });

        document.getElementById('in-inv').addEventListener('change', e => {
            lerImagem(e.target.files[0], 'st-inv', (low) => {
                let lista = [];
                dbItens.forEach(item => {
                    if(low.includes(item.key)) lista.push("- " + item.name);
                });
                document.getElementById('p-itens').value = lista.length > 0 ? lista.join("\n") : "Nada ilícito encontrado.";
            });
        });

        function gerar() {
            const val = id => document.getElementById(id).value;
            const agora = new Date();
            const rel = `5RELATÓRIO DE PERÍCIA CRIMINAL\n\n` +
                `IDENTIFICAÇÃO\nData: ${agora.toLocaleDateString('pt-BR')}\nHora: ${agora.getHours()}:${agora.getMinutes()}\n` +
                `Perito: <@${val('p-perito')}>\nAuxiliar: <@${val('p-auxiliar')}>\nID Suspeito: ${val('p-doc')}\n\n` +
                `INTRODUÇÃO:\nOcorrência de confronto/óbito em ${val('p-ref')}.\n\n` +
                `DADOS DA VÍTIMA:\nNome: ${val('p-nome')}\nPassaporte: ${val('p-doc')}\nPorte: ${val('p-porte')}\n\n` +
                `MOCHILA:\n${val('p-itens')}\n\n` +
                `CONCLUSÃO:\nÓbito confirmado por disparos de arma de fogo no local.`;

            const h = document.getElementById('copy-helper');
            h.value = rel; h.select(); document.execCommand('copy');
            alert("Relatório Copiado!");
        }
    </script>
</body>
</html>
