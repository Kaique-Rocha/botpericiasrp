<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Forense Pro V3</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --bg: #0d0d0d; --card: #161616; --primary: #007bff; --success: #28a745; --text: #e0e0e0; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: var(--card); padding: 30px; border-radius: 12px; width: 100%; max-width: 650px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #222; }
        h1 { font-size: 1.3rem; text-align: center; color: var(--primary); text-transform: uppercase; margin-bottom: 25px; border-bottom: 2px solid #222; padding-bottom: 15px; }
        .hidden { display: none; }
        .form-section { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #222; }
        .section-title { font-size: 0.9rem; color: var(--primary); font-weight: bold; text-transform: uppercase; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; background: #1f1f1f; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; text-transform: uppercase; }
        .btn-green { background: var(--success); color: white; }
        .btn-green:disabled { background: #2a4d36; color: #888; cursor: not-allowed; }
        .btn-gray { background: #333; color: #aaa; }
        .status-ia { font-size: 11px; color: #f1c40f; margin-top: 6px; font-family: monospace; }
        .upload-area { border: 2px dashed #333; padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; }
        .upload-area:hover { border-color: var(--primary); }
    </style>
</head>
<body>

    <div id="pericia" class="container">
        <h1>Relatório de Perícia</h1>
        
        <div class="form-section">
            <div class="section-title">🆔 Agentes</div>
            <div class="row">
                <div class="form-group"><label>Discord Perito:</label><input type="text" id="p-perito" value="67615"></div>
                <div class="form-group"><label>Discord Auxiliar:</label><input type="text" id="p-auxiliar" placeholder="na"></div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">📍 Local e Causa</div>
            <div class="form-group"><label>Referência:</label><input type="text" id="p-ref" placeholder="Vermelho / Arcadius"></div>
            <div class="row">
                <div class="form-group">
                    <label>Terreno:</label>
                    <select id="p-terreno"><option value="Edificação">Edificação</option><option value="Plano">Plano</option><option value="Montanhoso">Montanhoso</option></select>
                </div>
                <div class="form-group">
                    <label>Causa:</label>
                    <select id="p-tipo"><option value="acao">Disparo / Confronto</option><option value="encontrado">Encontrado</option></select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">📸 Upload MDT (Dados)</div>
            <div class="upload-area" onclick="document.getElementById('file-mdt').click()">Clique para subir SS do MDT</div>
            <input type="file" id="file-mdt" class="hidden" accept="image/*">
            <div id="st-mdt" class="status-ia">Aguardando...</div>
            <div class="row">
                <div class="form-group"><label>Nome:</label><input type="text" id="p-nome"></div>
                <div class="form-group"><label>ID:</label><input type="text" id="p-doc"></div>
            </div>
            <div class="row">
                <div class="form-group"><label>Idade:</label><input type="text" id="p-idade"></div>
                <div class="form-group"><label>Porte:</label><input type="text" id="p-porte"></div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">🎒 Upload Mochila (Itens)</div>
            <div class="upload-area" onclick="document.getElementById('file-inv').click()">Clique para subir SS da Mochila</div>
            <input type="file" id="file-inv" class="hidden" accept="image/*">
            <div id="st-inv" class="status-ia">Aguardando...</div>
            <textarea id="p-itens" rows="3" placeholder="Itens aparecerão aqui..."></textarea>
        </div>

        <button id="btn-gerar" class="btn btn-green" onclick="gerar()">Gerar e Copiar Relatório</button>
    </div>

    <textarea id="helper" style="position: absolute; left: -9999px;"></textarea>

    <script>
        const dicionario = [
            {k: "parafall", n: "Fuzil Parafall"}, {k: "pistola", n: "Pistola"},
            {k: "radio", n: "Rádio"}, {k: "cristal", n: "Cristal (Droga)"},
            {k: "muni", n: "Munições"}, {k: "colete", n: "Colete Balístico"}
        ];

        async function processarIA(file, statusId, callback) {
            const status = document.getElementById(statusId);
            status.innerText = "⏳ Processando imagem...";
            try {
                const { data: { text } } = await Tesseract.recognize(file, 'por');
                status.innerText = "✅ Concluído!";
                callback(text.toLowerCase(), text);
            } catch (e) {
                status.innerText = "❌ Erro na leitura. Tente novamente.";
                console.error(e);
            }
        }

        document.getElementById('file-mdt').addEventListener('change', e => {
            processarIA(e.target.files[0], 'st-mdt', (low, raw) => {
                // Tenta pegar o nome (Ex: Connor Ferrari [123])
                const match = raw.match(/(.+?)\[(\d+)\]/);
                if(match) {
                    document.getElementById('p-nome').value = match[1].trim();
                    document.getElementById('p-doc').value = match[2].trim();
                }
                if(low.includes("desabilitado")) document.getElementById('p-porte').value = "Desabilitado";
                else if(low.includes("habilitado")) document.getElementById('p-porte').value = "Habilitado";
            });
        });

        document.getElementById('file-inv').addEventListener('change', e => {
            processarIA(e.target.files[0], 'st-inv', (low) => {
                let achados = [];
                dicionario.forEach(i => { if(low.includes(i.k)) achados.push("- " + i.n); });
                document.getElementById('p-itens').value = achados.length > 0 ? achados.join("\n") : "N/A";
            });
        });

        function gerar() {
            const d = id => document.getElementById(id).value;
            const agora = new Date();
            const data = agora.toLocaleDateString('pt-BR');
            const hora = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');

            let txt = `5RELATÓRIO DE PERÍCIA CRIMINAL\n\n`;
            txt += `IDENTIFICAÇÃO\nData da pericia: ${data}\nHora da pericia: ${hora}\n`;
            txt += `Perito responsável: <@${d('p-perito')}>\nAuxiliares: <@${d('p-auxiliar')}>\nDocumento do Suspeito: ${d('p-doc')}\n\n`;
            txt += `INTRODUÇÃO:\nA Perícia foi realizada após uma ocorrência nas imediações de ${d('p-ref')}.\n\n`;
            txt += `DESCRIÇÃO DO LOCAL:\nO fato ocorreu perto de ${d('p-ref')}. Terreno tipo ${d('p-terreno')}.\n\n`;
            txt += `DADOS DA VÍTIMA:\nIndentidade: ${d('p-doc')}\nNome: ${d('p-nome')}\nIdade: ${d('p-idade')}\nPorte: ${d('p-porte')}\n\n`;
            txt += `ANÁLISE DO CADAVER:\nIndivíduo encontrado com perfurações de projéteis. Óbito confirmado no local.\n\n`;
            txt += `MOCHILA DA VÍTIMA:\n${d('p-itens')}\n\n`;
            txt += `CONCLUSÃO:\nConstatada morte cerebral por disparos de arma de fogo. Vítima faleceu nas imediações de ${d('p-ref')}.`;

            const h = document.getElementById('helper');
            h.value = txt; h.select(); document.execCommand('copy');
            alert("Copiado!");
        }
    </script>
</body>
</html>
